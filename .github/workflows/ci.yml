name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f docs/REPOSITORY_STRATEGY.md
          test -f docs/ARCHITECTURE.md
          echo "governance docs verified"
